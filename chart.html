<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>元数据工艺场景上下限</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f3f6fa;
            color: #172033;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            padding: 16px 24px 13px;
            background: rgba(255, 255, 255, .96);
            border-bottom: 1px solid #e6ebf2
        }

        h1 {
            margin: 0 0 5px;
            font-size: 21px;
            font-weight: 650;
            letter-spacing: .1px
        }

        .sub {
            font-size: 12.5px;
            color: #718096
        }

        .stats {
            display: flex;
            gap: 10px
        }

        .stats>div {
            min-width: 72px;
            padding: 7px 10px;
            border: 1px solid #e7ecf3;
            border-radius: 10px;
            background: #f8fafc;
            text-align: center
        }

        .stats b {
            display: block;
            font-size: 18px;
            font-variant-numeric: tabular-nums
        }

        .stats span {
            font-size: 12px;
            color: #64748b
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 7px 14px;
            background: #fbfcfe;
            border-bottom: 1px solid #e6ebf2
        }

        label {
            font-size: 13px;
            color: #475569
        }

        select,
        input {
            padding: 4px 8px;
            border: 1px solid #d7dee8;
            border-radius: 7px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .03);
            font: inherit;
            font-size: 13px
        }

        .meta {
            max-width: 230px
        }

        #spec {
            max-width: 220px
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap
        }

        .toolbar-secondary {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 100%;
            width: 100%;
            min-width: 0;
            overflow: hidden;
            order: 2
        }

        .result-count {
            padding: 3px 7px;
            border-radius: 7px;
            background: #eef6ff;
            color: #1d4f91;
            font-size: 12px;
            font-weight: 650;
            white-space: nowrap
        }

        .reset-button {
            padding: 4px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            color: #334155;
            font: inherit;
            font-size: 12.5px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .04)
        }

        .reset-button:hover {
            background: #f1f5f9;
            border-color: #94a3b8
        }

        .date-status { font-size: 12px; color: #64748b; white-space: nowrap }
        .date-status.error { color: #dc2626; font-weight: 600 }

        .view-switch { display: inline-flex; padding: 2px; border: 1px solid #cbd5e1; border-radius: 9px; background: #eef2f7 }
        .view-button { padding: 4px 9px; border: 0; border-radius: 6px; background: transparent; color: #475569; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap }
        .view-button.active { background: #2563eb; color: #fff; box-shadow: 0 1px 3px rgba(15, 23, 42, .2) }

        .mode-badge {
            padding: 4px 8px;
            border-radius: 999px;
            background: #e8f1ff;
            color: #2457a7;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap
        }

        .hint {
            margin-left: auto;
            font-size: 11.5px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0
        }

        #view {
            position: relative;
            flex: 1;
            min-height: 480px;
            background: radial-gradient(circle at 52% 44%, #ffffff 0, #f5f7fb 54%, #eef2f7 100%)
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block
        }

        .selection-overlay {
            position: absolute;
            inset: 0;
            z-index: 6;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none
        }

        .legend {
            position: absolute;
            left: 18px;
            top: 18px;
            background: rgba(255, 255, 255, .94);
            padding: 10px 13px;
            border: 1px solid rgba(215, 222, 232, .9);
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.8;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .07);
            backdrop-filter: blur(8px)
        }

        .sw {
            display: inline-block;
            width: 18px;
            height: 3px;
            margin-right: 7px;
            vertical-align: middle
        }

        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin: 0 12px 0 5px
        }

        .detail {
            position: absolute;
            right: 18px;
            top: 18px;
            max-width: 340px;
            background: rgba(255, 255, 255, .96);
            padding: 13px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 11px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .1);
            backdrop-filter: blur(8px);
            font-size: 14px;
            line-height: 1.7;
            display: none
        }

        .detail b {
            font-size: 15px
        }

        .tooltip {
            position: absolute;
            z-index: 8;
            display: none;
            pointer-events: none;
            max-width: 340px;
            padding: 11px 13px;
            border: 1px solid rgba(203, 213, 225, .9);
            border-radius: 9px;
            background: rgba(15, 23, 42, .9);
            color: #fff;
            font-size: 14px;
            line-height: 1.65;
            box-shadow: 0 8px 22px rgba(15, 23, 42, .2);
            backdrop-filter: blur(6px);
            transform: translate(12px, 12px)
        }

        .tooltip b {
            font-weight: 650;
            color: #fff
        }

        .tooltip .muted {
            color: #cbd5e1
        }

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            color: #64748b;
            z-index: 5
        }

        .drill-btn {
            margin-top: 9px;
            padding: 6px 11px;
            border: 1px solid #bfd3f6;
            border-radius: 8px;
            background: #eef6ff;
            color: #1d4f91;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer
        }

        .drill-btn:hover {
            background: #e2efff;
            border-color: #93b8f0
        }

        .drilldown {
            position: absolute;
            inset: 0;
            z-index: 9;
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 16px 20px 14px;
            background: #f3f6fa;
            overflow: auto
        }

        .drilldown.open {
            display: flex
        }

        .drill-head {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap
        }

        .drill-head b {
            font-size: 16.5px;
            font-weight: 650
        }

        .drill-sub {
            font-size: 12.5px;
            color: #64748b
        }

        .drill-summary {
            font-size: 13px;
            color: #334155;
            font-weight: 600
        }

        .drill-head .reset-button {
            margin-left: auto
        }

        .drill-card {
            flex: 1;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            padding: 12px 14px 8px;
            border: 1px solid #e6ebf2;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .06)
        }

        .drill-legend {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            padding: 0 4px 8px;
            font-size: 12px;
            color: #475569
        }

        .drill-legend .key {
            display: inline-flex;
            align-items: center;
            gap: 6px
        }

        .drill-tools {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .drill-table {
            display: none;
            max-height: 240px;
            overflow: auto;
            border: 1px solid #e6ebf2;
            border-radius: 10px;
            background: #fff
        }

        .drill-table.show {
            display: block
        }

        .drill-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            font-variant-numeric: tabular-nums
        }

        .drill-table th {
            position: sticky;
            top: 0;
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            text-align: right;
            padding: 7px 12px;
            border-bottom: 1px solid #e6ebf2;
            white-space: nowrap
        }

        .drill-table td {
            padding: 6px 12px;
            border-bottom: 1px solid #f1f5f9;
            text-align: right;
            color: #172033;
            white-space: nowrap
        }

        .drill-table th:first-child,
        .drill-table td:first-child {
            text-align: left
        }

        .status-ok {
            color: #15803d;
            font-weight: 600
        }

        .status-bad {
            color: #dc2626;
            font-weight: 600
        }

        @media(max-width:780px) {
            header {
                align-items: start;
                flex-direction: column
            }

            .hint {
                margin-left: 0;
                width: 100%
            }

            #view {
                height: 780px;
                flex: none
            }

            .detail {
                max-width: 270px
            }
        }
    </style>
</head>

<body>
    <header>

        <div class="loading" id="loading">正在构建 Three.js 场景…</div>
        <div class="legend">

            <div><span class="dot" style="background:#2563eb"></span>标准下限 <span id="standardUpperLegendDot" class="dot"
                    style="background:#e11d48"></span>标准上限</div>

        <div class="detail" id="detail"></div>
        <div class="tooltip" id="tooltip"></div>

            <div class="drill-card">

                    <span class="key"><svg width="20" height="12" aria-hidden="true"><line x1="2" y1="6" x2="18" y2="6" stroke="#dc2626" stroke-width="2"/><path d="M 7 3 L 13 9 M 7 9 L 13 3" stroke="#dc2626" stroke-width="2" stroke-linecap="round" fill="none"/></svg>实际日范围（超标）</span>
                    <span class="key"><svg width="20" height="12" aria-hidden="true"><line x1="2" y1="6" x2="18" y2="6" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/></svg>上限标准 / 下限标准</span>

            <div class="drill-table" id="drillTable"></div>
