<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>元数据工艺场景上下限</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #f3f6fa;
            color: #172033;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            padding: 16px 24px 13px;
            background: rgba(255, 255, 255, .96);
            border-bottom: 1px solid #e6ebf2
        }

        h1 {
            margin: 0 0 5px;
            font-size: 21px;
            font-weight: 650;
            letter-spacing: .1px
        }

        .sub {
            font-size: 12.5px;
            color: #718096
        }

        .stats {
            display: flex;
            gap: 10px
        }

        .stats>div {
            min-width: 72px;
            padding: 7px 10px;
            border: 1px solid #e7ecf3;
            border-radius: 10px;
            background: #f8fafc;
            text-align: center
        }

        .stats b {
            display: block;
            font-size: 18px;
            font-variant-numeric: tabular-nums
        }

        .stats span {
            font-size: 12px;
            color: #64748b
        }

        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 0 14px;
            background: #f8fafc;
            border-top: 1px solid #e8edf4;
            border-bottom: 1px solid #dfe6ef;
            box-shadow: 0 2px 8px rgba(15, 23, 42, .04)
        }

        .toolbar-primary {
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 54px;
            gap: 0
        }

        .query-section {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 34px;
            padding: 0 20px;
            border-right: 1px solid #dfe6ef
        }

        .query-section:first-child { padding-left: 4px }
        .query-section:last-child { border-right: 0; flex: 1 }

        .section-title {
            color: #1d5dab;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap
        }

        label {
            font-size: 13px;
            color: #475569
        }

        select,
        input {
            height: 32px;
            box-sizing: border-box;
            padding: 5px 10px;
            border: 1px solid #d7dee8;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .03);
            font: inherit;
            font-size: 13px;
            color: #1f2937;
            outline: none;
            transition: border-color .15s, box-shadow .15s
        }

        select:focus, input:focus { border-color: #6aa4f8; box-shadow: 0 0 0 3px rgba(37, 99, 235, .1) }

        .meta { display: none }

        .metadata-picker { position: relative; width: 290px; flex: 0 0 290px }
        .metadata-trigger {
            width: 100%; height: 34px; display: flex; align-items: center; justify-content: space-between;
            gap: 10px; padding: 5px 11px; border: 1px solid #d7dee8; border-radius: 8px;
            background: #fff; color: #1f2937; font: inherit; font-size: 13px; cursor: pointer;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .03); text-align: left
        }
        .metadata-trigger:hover { border-color: #94a3b8 }
        .metadata-trigger:focus, .metadata-picker.open .metadata-trigger { border-color: #6aa4f8; box-shadow: 0 0 0 3px rgba(37, 99, 235, .1); outline: none }
        .metadata-trigger:disabled { cursor: not-allowed; opacity: .6 }
        .metadata-trigger-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
        .metadata-chevron { color: #64748b; font-size: 15px; transition: transform .16s }
        .metadata-picker.open .metadata-chevron { transform: rotate(180deg) }
        .metadata-menu {
            position: absolute; z-index: 80; top: calc(100% + 6px); left: 0; width: 100%;
            padding: 8px; border: 1px solid #d7dee8; border-radius: 10px; background: #fff;
            box-shadow: 0 12px 30px rgba(15, 23, 42, .16); display: none
        }
        .metadata-picker.open .metadata-menu { display: block }
        #metadataSearch { width: 100%; padding-left: 30px }
        .metadata-options { max-height: 310px; margin-top: 7px; overflow-y: auto; overscroll-behavior: contain }
        .metadata-option {
            width: 100%; display: block; padding: 8px 10px; border: 0; border-radius: 6px;
            background: transparent; color: #334155; font: inherit; font-size: 13px;
            line-height: 1.35; text-align: left; cursor: pointer
        }
        .metadata-option:hover, .metadata-option.active { background: #eef5ff; color: #1d4ed8 }
        .metadata-option.overview-option {
            position: sticky; top: 0; z-index: 2; background: #fff;
            border-bottom: 1px solid #e5eaf1; border-radius: 6px 6px 3px 3px;
            box-shadow: 0 3px 7px rgba(15, 23, 42, .06); font-weight: 650
        }
        .metadata-option.overview-option:hover, .metadata-option.overview-option.active { background: #eef5ff }
        .metadata-empty { padding: 14px 10px; color: #94a3b8; font-size: 12.5px; text-align: center }

        .search-wrap { position: relative; display: inline-flex }
        .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 13px; pointer-events: none }

        #spec {
            max-width: 220px
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap
        }

        .toolbar-secondary {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            min-height: 48px;
            min-width: 0;
            overflow: hidden;
            border-top: 1px solid #e8edf4
        }

        .toolbar-actions { display: flex; align-items: center; gap: 10px; padding-left: 18px; border-left: 1px solid #dfe6ef }

        .result-count {
            padding: 7px 12px;
            border-radius: 8px;
            background: #eef6ff;
            color: #1d4f91;
            font-size: 12.5px;
            font-weight: 650;
            white-space: nowrap
        }

        .reset-button {
            min-height: 32px;
            padding: 5px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            color: #334155;
            font: inherit;
            font-size: 12.5px;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .04)
        }

        .reset-button:hover {
            background: #f1f5f9;
            border-color: #94a3b8
        }

        .primary-button { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 650; box-shadow: 0 2px 5px rgba(37, 99, 235, .22) }
        .primary-button:hover { background: #1d4ed8; border-color: #1d4ed8 }

        .date-status { font-size: 12px; color: #64748b; white-space: nowrap }
        .date-status.error { color: #dc2626; font-weight: 600 }

        .view-switch { display: inline-flex; min-height: 32px; padding: 2px; border: 1px solid #cbd5e1; border-radius: 9px; background: #eef2f7 }
        .view-button { padding: 5px 12px; border: 0; border-radius: 6px; background: transparent; color: #475569; font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap }
        .view-button.active { background: #2563eb; color: #fff; box-shadow: 0 1px 3px rgba(15, 23, 42, .2) }

        .mode-badge {
            padding: 4px 8px;
            border-radius: 999px;
            background: #e8f1ff;
            color: #2457a7;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap
        }

        .hint {
            margin-left: auto;
            padding-left: 20px;
            border-left: 1px solid #dfe6ef;
            font-size: 11.5px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0
        }

        #view {
            position: relative;
            flex: 1;
            min-height: 480px;
            background: radial-gradient(circle at 52% 44%, #ffffff 0, #f5f7fb 54%, #eef2f7 100%)
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block
        }

        .selection-overlay {
            position: absolute;
            inset: 0;
            z-index: 6;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none
        }

        .legend {
            position: absolute;
            left: 18px;
            top: 18px;
            background: rgba(255, 255, 255, .94);
            padding: 10px 13px;
            border: 1px solid rgba(215, 222, 232, .9);
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.8;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .07);
            backdrop-filter: blur(8px)
        }

        .sw {
            display: inline-block;
            width: 18px;
            height: 3px;
            margin-right: 7px;
            vertical-align: middle
        }

        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin: 0 12px 0 5px
        }

        .detail {
            position: absolute;
            right: 18px;
            top: 18px;
            max-width: 340px;
            background: rgba(255, 255, 255, .96);
            padding: 13px 15px;
            border: 1px solid #e2e8f0;
            border-radius: 11px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, .1);
            backdrop-filter: blur(8px);
            font-size: 14px;
            line-height: 1.7;
            display: none
        }

        .detail b {
            font-size: 15px
        }

        .tooltip {
            position: absolute;
            z-index: 8;
            display: none;
            pointer-events: none;
            max-width: 340px;
            padding: 11px 13px;
            border: 1px solid rgba(203, 213, 225, .9);
            border-radius: 9px;
            background: rgba(15, 23, 42, .9);
            color: #fff;
            font-size: 14px;
            line-height: 1.65;
            box-shadow: 0 8px 22px rgba(15, 23, 42, .2);
            backdrop-filter: blur(6px);
            transform: translate(12px, 12px)
        }

        .tooltip b {
            font-weight: 650;
            color: #fff
        }

        .tooltip .muted {
            color: #cbd5e1
        }

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            color: #64748b;
            z-index: 5
        }

        .drill-btn {
            margin-top: 9px;
            padding: 6px 11px;
            border: 1px solid #bfd3f6;
            border-radius: 8px;
            background: #eef6ff;
            color: #1d4f91;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer
        }

        .drill-btn:hover {
            background: #e2efff;
            border-color: #93b8f0
        }

        .drilldown {
            position: absolute;
            inset: 0;
            z-index: 9;
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 16px 20px 14px;
            background: #f3f6fa;
            overflow: auto
        }

        .drilldown.open {
            display: flex
        }

        .drill-head {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap
        }

        .drill-head b {
            font-size: 16.5px;
            font-weight: 650
        }

        .drill-sub {
            font-size: 12.5px;
            color: #64748b
        }

        .drill-summary {
            font-size: 13px;
            color: #334155;
            font-weight: 600
        }

        .drill-head .reset-button {
            margin-left: auto
        }

        .drill-card {
            flex: 1;
            min-height: 320px;
            display: flex;
            flex-direction: column;
            padding: 12px 14px 8px;
            border: 1px solid #e6ebf2;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 6px 18px rgba(15, 23, 42, .06)
        }

        .drill-legend {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            padding: 0 4px 8px;
            font-size: 12px;
            color: #475569
        }

        .drill-legend .key {
            display: inline-flex;
            align-items: center;
            gap: 6px
        }

        .drill-tools {
            display: flex;
            align-items: center;
            gap: 10px
        }

        .drill-table {
            display: none;
            max-height: 240px;
            overflow: auto;
            border: 1px solid #e6ebf2;
            border-radius: 10px;
            background: #fff
        }

        .drill-table.show {
            display: block
        }

        .drill-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            font-variant-numeric: tabular-nums
        }

        .drill-table th {
            position: sticky;
            top: 0;
            background: #f8fafc;
            color: #475569;
            font-weight: 600;
            text-align: right;
            padding: 7px 12px;
            border-bottom: 1px solid #e6ebf2;
            white-space: nowrap
        }

        .drill-table td {
            padding: 6px 12px;
            border-bottom: 1px solid #f1f5f9;
            text-align: right;
            color: #172033;
            white-space: nowrap
        }

        .drill-table th:first-child,
        .drill-table td:first-child {
            text-align: left
        }

        .status-ok {
            color: #15803d;
            font-weight: 600
        }

        .status-bad {
            color: #dc2626;
            font-weight: 600
        }

        @media(max-width:1500px) {
            .toolbar-primary { flex-wrap: wrap; padding: 8px 0 }
            .query-section { padding-top: 5px; padding-bottom: 5px }
            .query-section:last-child { flex: 0 0 100%; box-sizing: border-box; border-top: 1px solid #e8edf4; padding-left: 4px }
        }

        @media(max-width:780px) {
            header {
                align-items: start;
                flex-direction: column
            }

            .hint {
                margin-left: 0;
                width: 100%
            }

            .query-section { flex-wrap: wrap; flex: 0 0 100%; box-sizing: border-box; padding-left: 4px; border-right: 0 }
            .toolbar-secondary { flex-wrap: wrap; overflow: visible; padding: 8px 0 }
            .toolbar-actions { flex-wrap: wrap; padding-left: 0; border-left: 0 }

            #view {
                height: 780px;
                flex: none
            }

            .detail {
                max-width: 270px
            }
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 id="title">元数据工艺场景上下限</h1>
            <div class="sub" id="axisDescription">X轴：拉速；Y轴：钢种＋宽度；Z轴：当前元数据上下限值。</div>
        </div>
    </header>
    <div class="toolbar">
        <div class="toolbar-primary">
            <div class="query-section">
                <span class="section-title">元数据</span>
                <div class="metadata-picker" id="metadataPicker">
                    <button type="button" class="metadata-trigger" id="metadataTrigger" aria-haspopup="listbox" aria-expanded="false">
                        <span class="metadata-trigger-text" id="metadataTriggerText">正在读取数据库…</span><span class="metadata-chevron">⌄</span>
                    </button>
                    <div class="metadata-menu" id="metadataMenu">
                        <div class="search-wrap"><span class="search-icon">⌕</span><input type="search" id="metadataSearch" placeholder="搜索名称或编码" autocomplete="off"></div>
                        <div class="metadata-options" id="metadataOptions" role="listbox"></div>
                    </div>
                    <select id="metadata" class="meta" aria-label="元数据" tabindex="-1"></select>
                </div>
            </div>
            <div class="query-section">
                <span class="section-title">工艺条件</span>
                <div class="filter-group"><label for="spec">钢种规格</label><select id="spec"><option value="全部">全部</option></select></div>
                <div class="filter-group"><label for="speed">拉速</label><select id="speed"><option value="全部">全部</option></select></div>
            </div>
            <div class="query-section time-only">
                <span class="section-title">时间范围</span>
                <div class="filter-group"><label for="startDate">开始</label><input type="date" id="startDate"></div>
                <div class="filter-group"><label for="endDate">结束</label><input type="date" id="endDate"></div>
                <button type="button" id="applyDates" class="reset-button primary-button">查询时间</button>
                <span id="dateStatus" class="date-status"></span>
            </div>
        </div>
        <div class="toolbar-secondary">
            <div class="result-count" id="resultCount">符合条件：0 条</div>
            <div class="toolbar-actions">
                <button type="button" id="resetFilters" class="reset-button">重置筛选</button>
                <button type="button" id="boundsOnlyReset" class="reset-button compare-only" style="display:none">复位只看上下限</button>
                <div class="view-switch" aria-label="视图切换">
                    <button type="button" id="view2dButton" class="view-button">二维点位分布</button>
                    <button type="button" id="view3dButton" class="view-button active">三维上下限</button>
                </div>
                <span class="mode-badge">透镜模式</span>
            </div>
            <div class="hint">左键旋转 · 右键平移 · 滚轮缩放 · 单击高亮 · 双击取消</div>
        </div>
    </div>
    <div id="view"><canvas id="canvas"></canvas>
        <svg id="selectionOverlay" class="selection-overlay" aria-hidden="true">
            <g id="selectionOverlayGroup" style="display:none">
                <line id="standardOverlayLine" stroke="#2563eb" stroke-width="1" vector-effect="non-scaling-stroke"/>
                <circle id="standardOverlayLower" r="2" fill="#2563eb"/>
                <circle id="standardOverlayUpper" r="2" fill="#2563eb"/>
                <line id="actualOverlayLine" stroke="#dc2626" stroke-width="1" vector-effect="non-scaling-stroke"/>
                <circle id="actualOverlayLower" r="2" fill="#dc2626"/>
                <circle id="actualOverlayUpper" r="2" fill="#dc2626"/>
            </g>
            <circle id="distributionSelection" r="6" fill="#2563eb" stroke="none" style="display:none"/>
        </svg>
        <div class="loading" id="loading">正在构建 Three.js 场景…</div>
        <div class="legend">
            <div id="standardRangeLegend"><span class="sw" style="background:#2563eb"></span>标准上下限范围</div>
            <div id="standardDotsLegend"><span class="dot" style="background:#2563eb"></span>标准下限 <span id="standardUpperLegendDot" class="dot"
                    style="background:#e11d48"></span>标准上限</div>
            <div id="actualNormalLegend" class="compare-only"><span class="sw" style="background:#16a34a;height:5px"></span>实际范围（正常）</div>
            <div id="actualAbnormalLegend" class="compare-only"><span class="sw" style="background:#dc2626;height:5px"></span>实际范围（超标）</div>
            <div id="selectionLegend"><span class="sw" style="background:#111827;height:5px"></span><span id="selectionLegendText">单击突出所选标准与实际范围</span></div>
            <div id="distributionLegend" style="display:none"><span class="dot" id="distributionBlueDot" style="background:#2563eb"></span><span id="distributionLegendText">工艺点位</span></div>
        </div>
        <div class="detail" id="detail"></div>
        <div class="tooltip" id="tooltip"></div>
        <div class="drilldown" id="drilldown">
            <div class="drill-head">
                <b id="drillTitle"></b><span class="drill-sub" id="drillScene"></span>
                <span class="drill-summary" id="drillSummary"></span>
                <button type="button" id="drillClose" class="reset-button">← 返回三维视图</button>
            </div>
            <div class="drill-card">
                <div class="drill-legend">
                    <span class="key"><svg width="20" height="12" aria-hidden="true"><line x1="2" y1="6" x2="18" y2="6" stroke="#16a34a" stroke-width="2"/><circle cx="10" cy="6" r="3.5" fill="#16a34a" stroke="#fff" stroke-width="1.5"/></svg>实际日范围（在标准内）</span>
                    <span class="key"><svg width="20" height="12" aria-hidden="true"><line x1="2" y1="6" x2="18" y2="6" stroke="#dc2626" stroke-width="2"/><path d="M 7 3 L 13 9 M 7 9 L 13 3" stroke="#dc2626" stroke-width="2" stroke-linecap="round" fill="none"/></svg>实际日范围（超标）</span>
                    <span class="key"><svg width="20" height="12" aria-hidden="true"><line x1="2" y1="6" x2="18" y2="6" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3"/></svg>上限标准 / 下限标准</span>
                    <span class="key"><svg width="20" height="12" aria-hidden="true"><rect x="2" y="3" width="16" height="6" rx="1.5" fill="rgba(71,85,105,.12)"/></svg>允许区间</span>
                </div>
                <div id="drillWrap" style="flex:1;min-height:0;position:relative">
                    <svg id="drillSvg" width="100%" height="100%" role="img"></svg>
                    <div class="tooltip" id="drillTip"></div>
                </div>
            </div>
            <div class="drill-tools">
                <button type="button" id="drillTableBtn" class="reset-button">显示数据表</button>
                <span class="drill-sub">悬停查看每日数值 · Esc 返回三维视图</span>
            </div>
            <div class="drill-table" id="drillTable"></div>
        </div>
    </div>
    <script>
        let records = [];
        let overviewPayload = null;
        let overviewPointCloud = null;
        let selectedOverviewPoint = null;
        let dailyRecords = [];
        let metadataCatalog = [];
        let availableDates = [];
        let minAvailableDate = "", maxAvailableDate = "";
        const API_BASE = `${window.location.origin}/api`;
        const conditionKey = (code, steel, width, speed) => [code, steel, Number(width), Number(speed).toFixed(2)].join("|");
        const inclusiveDays = (start, end) => Math.round((Date.parse(end + "T00:00:00Z") - Date.parse(start + "T00:00:00Z")) / 86400000) + 1;
        function aggregateActual(start, end) {
            const result = new Map();
            dailyRecords.forEach(d => {
                if (d.d < start || d.d > end) return;
                const key = conditionKey(d.c, d.s, d.w, d.v), found = result.get(key);
                if (found) { found.lower = Math.min(found.lower, d.l); found.upper = Math.max(found.upper, d.u); found.count += d.n }
                else result.set(key, { lower: d.l, upper: d.u, count: d.n });
            });
            return result;
        }
        let selectedStartDate = "";
        let selectedEndDate = "";
        let viewMode = "standard";
        let actualByKey = new Map();
        let overviewActualByKey = new Map();

                    );
                    if (metadataIndex >= 0 && conditionIndex >= 0) {
                        const condition = overviewPayload.conditions[conditionIndex];
                        const upper = overviewPayload.upperValues[metadataIndex * overviewPayload.conditions.length + conditionIndex];
                        if (upper !== null && Number.isFinite(Number(upper))) selectRow(-1, "gold", { ...condition, overviewIndex: conditionIndex, metadata: overviewPayload.metadata[metadataIndex].name, metadataCode: picked.metadataCode, lower: Number(upper), upper: Number(upper) });
                    }
                } else clearSelection();
                overviewDropdownFilters = null;
            } catch (error) {
                await restoreOverviewAfterTransitionFailure(error, overviewDropdownFilters);
            } finally {
                standardUpperTransition = null;
                metadataSceneBuildMode = null;
                removeTemporaryLayer(collapsingLayer);
                removeTemporaryLayer(overviewSelectedLayer);
                if (previousAxes) {
                    scene.remove(previousAxes);
                    disposeObject(previousAxes);
                }
                metadataSwitchAnimating = false;
                setMetadataDisabled(false);
                controls.enabled = true;
                controls.enableRotate = true;
                controls.update();
                render();
            }
        }
        async function loadOverviewWithFade(filterState = null) { await reverseToOverview(null, filterState) }
        async function loadStandards({ deferBuild = false, prefetchedRecords = null, filterState = null, requestVersion = null } = {}) {
            const item = metadataCatalog.find(row => row.code === metadata.value);
            if (!item) return;
            dateStatus.textContent = "正在读取上下限标准…"; applyDates.disabled = true;
            startDate.disabled = endDate.disabled = false;
            const loadedRecords = prefetchedRecords !== null ? prefetchedRecords : await fetchJson(`${API_BASE}/standards?code=${encodeURIComponent(item.code)}`);
            if (requestVersion !== null && requestVersion !== dataRequestVersion) return false;
            records = alignRecordsToOverviewCoordinates(loadedRecords);
            dailyRecords = []; actualByKey = new Map(); viewMode = "standard";
            boundsOnlyActive = false; boundsOnlyReset.textContent = "复位只看上下限";
            boundsOnlyReset.style.display = "none"; spec.value = speed.value = "全部";
            applyMetadataDates(item);
            applyRetainedDates(filterState);
            applyRetainedFilters(filterState);
            clearSelection();
            if (!deferBuild) {
                build();
                dateStatus.textContent = "未查询时间，当前只显示上下限标准";
                dateStatus.classList.remove("error");
            }
            applyDates.disabled = false;
            return true;
        }
        async function loadMetadataTimeComparison(code, start, end, prefetchedDailyRecords = null, filterState = null, requestVersion = null) {
            const loadedDailyRecords = prefetchedDailyRecords !== null ? prefetchedDailyRecords : await fetchJson(`${API_BASE}/daily?code=${encodeURIComponent(code)}&start=${start}&end=${end}`);
            if (requestVersion !== null && requestVersion !== dataRequestVersion) return false;
            dailyRecords = loadedDailyRecords;
            minAvailableDate = !minAvailableDate || start < minAvailableDate ? start : minAvailableDate;
            maxAvailableDate = !maxAvailableDate || end > maxAvailableDate ? end : maxAvailableDate;
            startDate.min = endDate.min = minAvailableDate;
            startDate.max = endDate.max = maxAvailableDate;
            selectedStartDate = start;
            selectedEndDate = end;
            startDate.value = start;
            endDate.value = end;
            actualByKey = aggregateActual(start, end);
            viewMode = "compare";
            boundsOnlyActive = false;
            boundsOnlyReset.textContent = "复位只看上下限";
            document.getElementById("actualNormalLegend").style.display = "";
            document.getElementById("actualAbnormalLegend").style.display = "";
            document.getElementById("selectionLegendText").textContent = "单击突出所选标准与实际范围";
            boundsOnlyReset.style.display = "";
            closeDrilldown();
            clearSelection();
            applyRetainedFilters(filterState);
            build();
            updateDateStatusForSpec();
            return true;
        }
        function renderMetadataOptions(query = "", selectedCode = metadata.value || "__all__") {
            const keyword = query.trim().toLocaleLowerCase("zh-CN");
            const matches = item => !keyword || item.name.toLocaleLowerCase("zh-CN").includes(keyword) || item.code.toLocaleLowerCase("zh-CN").includes(keyword);
            const visibleItems = metadataCatalog.filter(matches);
            const selectedItem = metadataCatalog.find(item => item.code === selectedCode);
            metadata.innerHTML = "";
            if (!keyword || selectedCode === "__all__") {
                const allOption = document.createElement("option");
                allOption.value = "__all__";
                allOption.textContent = "全部元数据上限总览";
                metadata.appendChild(allOption);
            }
            if (selectedItem && !visibleItems.some(item => item.code === selectedCode)) {
                const option = document.createElement("option");
                option.value = selectedItem.code;
                option.textContent = `${selectedItem.name}（当前）`;
                metadata.appendChild(option);
            }
            visibleItems.forEach(item => {
                const option = document.createElement("option");
                option.value = item.code;
                option.textContent = item.name;
                metadata.appendChild(option);
            });
            if ([...metadata.options].some(option => option.value === selectedCode)) metadata.value = selectedCode;
            const choices = [];
            const overviewChoice = { code: "__all__", name: "全部元数据上限总览" };
            if (!keyword || overviewChoice.name.toLocaleLowerCase("zh-CN").includes(keyword)) choices.push(overviewChoice);
            visibleItems.forEach(item => choices.push({ code: item.code, name: item.name }));
            metadataOptions.innerHTML = choices.length ? "" : '<div class="metadata-empty">没有匹配的元数据</div>';
            choices.forEach(item => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "metadata-option" + (item.code === "__all__" ? " overview-option" : "") + (item.code === selectedCode ? " active" : "");
                button.dataset.code = item.code;
                button.setAttribute("role", "option");
                button.setAttribute("aria-selected", item.code === selectedCode ? "true" : "false");
                button.textContent = item.name;
                metadataOptions.appendChild(button);
            });
            metadataTriggerText.textContent = selectedCode === "__all__"
                ? "全部元数据上限总览"
                : (metadataCatalog.find(item => item.code === selectedCode)?.name || metadata.selectedOptions[0]?.textContent || "请选择元数据");
        }
        async function loadMetadataCatalog() {
            metadataCatalog = await fetchJson(`${API_BASE}/metadata`);
            renderMetadataOptions("", "__all__");
            if (!metadataCatalog.length) throw new Error("数据库中没有同时具备上下限标准和实际统计结果的元数据");
            await loadOverview();
        }
        async function applyDateSelection() {
            const start = startDate.value, end = endDate.value, days = inclusiveDays(start, end);
            if (!start || !end || end < start) { dateStatus.textContent = "结束日期不能早于开始日期"; dateStatus.classList.add("error"); return }
            if (days < 7 || days > 365) { dateStatus.textContent = `请选择7～365天，当前${days}天`; dateStatus.classList.add("error"); return }
            const requestVersion = ++dataRequestVersion;
            const requestedMetadata = metadata.value;
            const requestIsCurrent = () => requestVersion === dataRequestVersion
                && metadata.value === requestedMetadata
                && startDate.value === start
                && endDate.value === end;
            applyDates.disabled = true; dateStatus.textContent = "正在查询实际数据…"; dateStatus.classList.remove("error");
            try {
                if (metadata.value === "__all__") {
                    const overviewRows = await fetchOverviewActualRows(start, end);
                    if (!requestIsCurrent()) return;
                    storeOverviewActualRows(overviewRows, start, end);
                    viewMode = "overview";
                    closeDrilldown(); clearSelection(); refreshFilterOptions(); build();
                    dateStatus.textContent = `已查询全部元数据：${start} 至 ${end}（${days}天），仅显示有生产数据的点`;
                    return;
                }
                const metadataRows = await fetchJson(`${API_BASE}/daily?code=${encodeURIComponent(requestedMetadata)}&start=${start}&end=${end}`);
                if (!requestIsCurrent()) return;
                await loadMetadataTimeComparison(requestedMetadata, start, end, metadataRows);
            } catch (error) {
                if (requestVersion === dataRequestVersion) {
                    dateStatus.textContent = error.message;
                    dateStatus.classList.add("error");
                }
            }
            finally { if (requestVersion === dataRequestVersion) applyDates.disabled = false }
        }
        boundsOnlyReset.onclick = () => {
            setBoundsOnly(!boundsOnlyActive);
            updateDistributionPointColors();
            render();
        };
        view3dButton.onclick = () => switchDimension("3d", { preserveSelection: Boolean(selectedRowData) });
        view2dButton.onclick = () => switchDimension("2d", { preserveSelection: Boolean(selectedRowData) });
        applyDates.onclick = applyDateSelection;
        function closeMetadataMenu() {
            metadataPicker.classList.remove("open");
            metadataTrigger.setAttribute("aria-expanded", "false");
        }
        metadataTrigger.addEventListener("click", () => {
            if (metadataTrigger.disabled) return;
            const opening = !metadataPicker.classList.contains("open");
            metadataPicker.classList.toggle("open", opening);
            metadataTrigger.setAttribute("aria-expanded", opening ? "true" : "false");
            if (opening) {
                metadataSearch.value = "";
                renderMetadataOptions("", metadata.value);
                requestAnimationFrame(() => metadataSearch.focus());
            }
        });
        metadataOptions.addEventListener("click", event => {
            const option = event.target.closest("[data-code]");
            if (!option) return;
            metadata.value = option.dataset.code;
            closeMetadataMenu();
            metadata.dispatchEvent(new Event("change"));
        });
        document.addEventListener("pointerdown", event => {
            if (!metadataPicker.contains(event.target)) closeMetadataMenu();
        });
        metadataSearch.addEventListener("input", () => renderMetadataOptions(metadataSearch.value));
        metadataSearch.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                metadataSearch.value = "";
                renderMetadataOptions("", metadata.value);
                closeMetadataMenu();
                metadataTrigger.focus();
                return;
            }
            if (event.key !== "Enter") return;
            const keyword = metadataSearch.value.trim().toLocaleLowerCase("zh-CN");
            if (!keyword) return;
            const first = metadataCatalog.find(item => item.name.toLocaleLowerCase("zh-CN").includes(keyword) || item.code.toLocaleLowerCase("zh-CN").includes(keyword));
            if (!first) return;
            event.preventDefault();
            metadata.value = first.code;
            closeMetadataMenu();
            metadata.dispatchEvent(new Event("change"));
        });
        metadata.onchange = async () => {
            const switchRequestVersion = ++dataRequestVersion;
            const retainedFilters = captureFilterState();
            const selectedCode = metadata.value;
            closeMetadataMenu();
            metadataSearch.value = "";
            renderMetadataOptions("", selectedCode);
            closeDrilldown();
            try {
                if (metadata.value === "__all__") {
                    if (viewMode === "overview") await loadOverview(retainedFilters, retainedFilters.timeActive);
                    else await loadOverviewWithFade(retainedFilters);
                }
                else if (viewMode === "overview" && dimensionMode === "3d") await selectMetadataFromOverview();
                else if (retainedFilters.timeActive) {
                    const standardsLoaded = await loadStandards({ deferBuild: true, filterState: retainedFilters, requestVersion: switchRequestVersion });
                    if (!standardsLoaded) return;
                    await loadMetadataTimeComparison(selectedCode, retainedFilters.start, retainedFilters.end, null, retainedFilters, switchRequestVersion);
                } else {
                    await loadStandards({ filterState: retainedFilters, requestVersion: switchRequestVersion });
                }
            }
            catch (error) {
                if (switchRequestVersion === dataRequestVersion) {
                    dateStatus.textContent = error.message;
                    dateStatus.classList.add("error");
                    applyDates.disabled = false;
                }
            }
        };
        function rebuildAfterConditionFilter() {
            closeDrilldown();
            clearSelection();
            lastPick = null;
            tooltip.style.display = "none";
            updateDateStatusForSpec();
            build();
        }
        spec.onchange = () => { refreshFilterOptions("spec"); rebuildAfterConditionFilter() };
        speed.onchange = () => { refreshFilterOptions("speed"); rebuildAfterConditionFilter() };
        resetFilters.onclick = () => {
            dataRequestVersion++;
            closeDrilldown(); viewMode = metadata.value === "__all__" ? "overview" : "standard"; dailyRecords = []; actualByKey = new Map();
            if (viewMode === "overview") { overviewActualByKey = new Map(); overviewComparisonActive = false; }
            boundsOnlyActive = false; boundsOnlyReset.textContent = "复位只看上下限"; boundsOnlyReset.style.display = "none";
            dateStatus.textContent = viewMode === "overview" ? "当前为全部元数据上限总览；选择单个元数据可查看上下限及时间对比" : "未查询时间，当前只显示上下限标准"; dateStatus.classList.remove("error");
            spec.value = speed.value = "全部"; clearSelection(); refreshFilterOptions(); build();
        };
        resize(); animate();
        loadMetadataCatalog().catch(error => {
            metadata.innerHTML = '<option value="">读取失败</option>';
            dateStatus.textContent = error.message; dateStatus.classList.add("error");
        });
    </script>
</body>
