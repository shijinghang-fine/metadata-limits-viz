# 复制本文件为 config.yaml 后填写真实连接信息。
# config.yaml 已被 .gitignore 排除，请勿提交密码或 Token。

Mysql:
  Host: "company-mysql.example.local"
  Port: 3306
  Username: "your_username"
  Password: "your_password"
  database: "metadata_database"
  organ_code: "your_organ_code"

Influxdb:
  url: "http://influxdb.example.local:8086"
  token: "your_influxdb_token"
  org: "your_org"
  bucket: "your_bucket"

ResultMysql:
  Host: "result-mysql.example.local"
  Port: 3306
  Username: "your_username"
  Password: "your_password"
  database: "metadata_result_database"

# 以下文件建议使用绝对路径，或相对于执行命令所在目录填写。
CodesFile: "D:/path/to/metadata_codes.json"
ProductionExcel: "D:/path/to/3ST生产明细.xlsx"

